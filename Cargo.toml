[package]
name = "notion-api-credential-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
crossterm = "0.29.0"
dialoguer = "0.12.0"
