[package]
name = "notion-api-credential-manager"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "api-manager"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dotenvy = "0.15.7"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "2.0.21"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
tempfile = "3.10"
